      <h2>3. How we use your information</h2>
      <ul>

      <h2>4. Payments via Stripe</h2>
      <p>
        Paid event transactions on LetsPlay are processed by
        <a
          href="https://stripe.com/en-ca/privacy"
          rel="noopener"
          target="_blank"
          >Stripe, Inc.</a
        >, a third-party payment processor. When you pay for an event, your
        payment card details are submitted directly to Stripe and are
        <strong>never stored on LetsPlay&rsquo;s servers</strong>. We receive
        only a transaction reference and the amount paid so we can confirm your
        booking. Stripe&rsquo;s use of your information is governed by
        Stripe&rsquo;s own privacy policy.
      </p>

      <h2>5. How we share information</h2>
      <p>
        <strong>We do not sell your personal information.</strong> We share
        information only in these limited situations:
      </p>
      <ul>
        <li>
          <strong>With hosts and other participants</strong> of events you
          create or join — limited to your first name, last initial, profile
          photo (if any), and the information you choose to put on your
          profile.
        </li>
        <li>
          <strong>With trusted service providers</strong> who process data on
          our behalf under contract: Supabase (hosting, database, and
          authentication) and Stripe (payments). These providers are bound to
          use your information only to deliver their service to us.
        </li>
        <li>
          <strong>When legally required</strong>, such as a valid court order
          or to protect the rights, safety, or property of LetsPlay, our users,
          or the public.
        </li>
      </ul>

      <h2>6. Location data</h2>
      <p>
        Location data is collected only after you grant your device&rsquo;s
        location permission, and only while you are using the app to find or
        host events. We use it to sort events by distance and to surface
        relevant nearby games. You can revoke location permission at any time
        in your device&rsquo;s system settings; the app will continue to work
        without it, but distance-based sorting will be disabled.
      </p>

      <h2>7. Data retention</h2>
      <p>
        We retain your personal information for as long as your account is
        active. When you delete your account (see section 9), we delete your
        profile and personal information from our active systems within
        <strong>30 days</strong>, except for information we are required to
        retain for legal, accounting, or fraud-prevention purposes (for
        example, Stripe transaction records that must be kept under Canadian
        tax law).
      </p>

      <h2>8. Your rights under PIPEDA</h2>
      <p>You have the right to:</p>
      <ul>
        <li>
          <strong>Access</strong> the personal information we hold about you.
        </li>
        <li>
          <strong>Correct</strong> information that is inaccurate or
          incomplete.
        </li>
        <li>
          <strong>Withdraw consent</strong> for our use of your information,
          subject to legal and contractual restrictions (note that withdrawing
          consent may prevent you from continuing to use the Service).
        </li>
        <li>
          <strong>Lodge a complaint</strong> with the
          <a
            href="https://www.priv.gc.ca/en/report-a-concern/"
            rel="noopener"
            target="_blank"
            >Office of the Privacy Commissioner of Canada</a
          >
          if you believe we have not handled your information appropriately.
        </li>
      </ul>
      <p>
        To exercise any of these rights, email
        <a href="mailto:support@letsplayapp.ca">support@letsplayapp.ca</a> from
        the address associated with your account.
      </p>

      <h2>9. Deleting your account</h2>
      <p>
        You can delete your account at any time from inside the LetsPlay app
        (Profile &rarr; Settings &rarr; Delete account), or by emailing
        <a href="mailto:support@letsplayapp.ca">support@letsplayapp.ca</a> from
        the address on your account.
      </p>
      <p>
        When you delete your account, we permanently remove your profile,
        contact details, and optional information (bio, favorite sports,
        location) from our active systems within 30 days. Posts and messages
        you sent to other users may remain visible to those recipients but
        will be shown as from a deleted account. As noted above, payment
        records held by Stripe and any records we are legally required to keep
        will be retained for the minimum period required by law.
      </p>

      <h2>10. How we protect your information</h2>
      <ul>
        <li>All traffic to and from the app is encrypted in transit over HTTPS.</li>
        <li>

          and never see them in plaintext.
        </li>
        <li>
          Access to production systems is restricted to authorized personnel
          and protected by multi-factor authentication.
        </li>
      </ul>

      <h2>11. Children</h2>

        information promptly.
